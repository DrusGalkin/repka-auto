<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repka Auto</title><style>
body{background:#0b111b;color:#e5edf8;font:18px system-ui;margin:0;padding:30px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px}small{color:#91a5bd}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:24px}.card{background:#162131;padding:24px;border-radius:20px}.value{font-size:42px;color:#68e0c0;margin:14px 0}.stale{opacity:.45}#status{color:#ffcf70}footer{margin:24px 0;color:#91a5bd}</style>
<header><div><small>БОРТОВОЙ КОМПЬЮТЕР</small><h1>Repka Auto</h1></div><span id="status">Подключение…</span></header><div id="grid"></div><footer>OBD2 · Только чтение · Данные старше 15 секунд скрыты</footer><script>
const names={RPM:'Обороты двигателя',SPEED:'Скорость',COOLANT_TEMP:'Температура ОЖ',ENGINE_LOAD:'Нагрузка',THROTTLE_POS:'Дроссель',INTAKE_TEMP:'Температура впуска',INTAKE_PRESSURE:'Давление впуска',MAF:'Расход воздуха',FUEL_LEVEL:'Топливо',CONTROL_MODULE_VOLTAGE:'Напряжение ЭБУ',TIMING_ADVANCE:'Угол зажигания',SHORT_FUEL_TRIM_1:'Краткая коррекция',LONG_FUEL_TRIM_1:'Длинная коррекция',FUEL_PRESSURE:'Давление топлива',OIL_TEMP:'Температура масла',RUN_TIME:'Время работы',DISTANCE_W_MIL:'Пробег с MIL'};
const units={rpm:'об/мин','km/h':'км/ч',degC:'°C',percent:'%',volt:'В',second:'с',degree:'°',km:'км','g/s':'г/с',kPa:'кПа'};
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();const s=await r.json();document.querySelector('#status').textContent=(s.demo?'ДЕМО · ':'')+({connected:'Автомобиль подключён',connecting:'Поиск OBD2…',disconnected:'Нет связи с автомобилем'}[s.status]||s.status);const grid=document.querySelector('#grid');grid.replaceChildren();for(const [key,label] of Object.entries(names)){const [value,unit,ts]=s.metrics[key]||[null,'',0];const fresh=value!==null&&Date.now()/1000-ts<15;const card=document.createElement('div');card.className='card'+(fresh?'':' stale');const name=document.createElement('div');name.textContent=label;const v=document.createElement('div');v.className='value';v.textContent=fresh?value:'—';const u=document.createElement('small');u.textContent=fresh?(units[unit]||unit):'Нет актуальных данных';card.append(name,v,u);grid.append(card)}}catch{document.querySelector('#status').textContent='Сервис недоступен';document.querySelector('#grid').replaceChildren()}finally{setTimeout(refresh,1000)}}refresh();</script></html>
